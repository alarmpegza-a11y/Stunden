<html lang="de">
<head>
    <meta charset="UTF-8">

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        const firebaseConfigMontage = {

        };
        const firebaseConfigKalender = {

            projectId: "pe-kalender-alle-gruppen",

    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Barlow', sans-serif; background: #0a0f1a; color: #e2e8f0; min-height: 100vh; }
        h1, h2, h3, .label-font { font-family: 'Barlow Condensed', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .auftrag-card {
            background: #111827; border: 1px solid #1f2937;
            border-radius: 12px; transition: all 0.15s;
            position: relative; overflow: visible;
        }
        .auftrag-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 3px; background: #334155; transition: background 0.2s;
            border-radius: 12px 0 0 12px;
        }
        .auftrag-card.sent::before { background: #10b981; }
        .auftrag-card.sending::before { background: #f59e0b; animation: pulse 1s infinite; }
        .auftrag-card.selectable:hover { border-color: #2d3f5c; background: #131e2e; }
        .auftrag-card.selected { border-color: #3b82f6 !important; background: #0f1e35 !important; box-shadow: 0 0 0 2px rgba(59,130,246,0.25); }
        .auftrag-card.selected::before { background: #3b82f6 !important; }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        .day-header {
            background: linear-gradient(90deg, #1e293b, transparent);
            border-left: 3px solid #3b82f6; padding: 8px 16px;
            border-radius: 6px; margin: 20px 0 10px;
        }
        .day-name { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #60a5fa; }
        .day-date { font-size: 12px; color: #64748b; font-weight: 600; }

        .group-dropdown {
            position: fixed; z-index: 9999;
            background: #1a2540; border: 1px solid #2d3f5c;
            border-radius: 12px; padding: 6px;
            min-width: 280px; box-shadow: 0 24px 60px rgba(0,0,0,0.85);
        }
        .group-option {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border-radius: 7px; cursor: pointer;
            font-size: 11px; font-weight: 700; color: #e2e8f0;
            transition: background 0.1s; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .group-option:hover { background: rgba(59,130,246,0.15); }
        .group-option-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .cal-type-badge { font-size: 8px; font-weight: 800; padding: 1px 5px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.5px; }

        .stat-box { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 14px 18px; }
        .stat-val { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 900; }
        .stat-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #64748b; margin-top: 2px; }

        .toast {
            position: fixed; bottom: 100px; right: 24px; z-index: 10000;
            background: #1e293b; border: 1px solid #334155;
            border-radius: 12px; padding: 14px 18px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: toastIn 0.3s ease-out; min-width: 280px; max-width: 400px;
        }
        .toast.success { border-color: rgba(16,185,129,0.5); }
        .toast.error { border-color: rgba(239,68,68,0.5); }
        @keyframes toastIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

        .progress-bar { height: 3px; background: #0f172a; border-radius: 2px; overflow: hidden; margin-top: 4px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width 0.4s ease; }

        /* ── CHECKBOX ── */
        .cb {
            width: 22px; height: 22px; border-radius: 6px;
            border: 2px solid #334155; background: #0f172a;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.15s; cursor: pointer; font-size: 12px;
        }
        .cb.checked { background: #3b82f6; border-color: #3b82f6; color: #fff; }

        /* ── FLOATING SELECTION BAR ── */
        .sel-bar {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 5000;
            background: #1a2540;
            border: 1.5px solid #2d4a7a;
            border-radius: 18px; padding: 12px 20px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(59,130,246,0.15);
            animation: barUp 0.3s cubic-bezier(.34,1.56,.64,1);
            white-space: nowrap; flex-wrap: nowrap;
        }
        @keyframes barUp { from{opacity:0;transform:translateX(-50%) translateY(24px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }
        .sel-bar-count {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #fff; font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px; font-weight: 900; border-radius: 10px;
            padding: 2px 14px; min-width: 40px; text-align: center;
        }
        .sel-bar-btn {
            padding: 8px 16px; border-radius: 10px; cursor: pointer;
            font-size: 10px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.8px; border: 1.5px solid; transition: all 0.15s;
            font-family: 'Barlow Condensed', sans-serif; white-space: nowrap;
        }

        /* ── SELECT MODE TOOLBAR ── */
        .sel-toolbar {
            background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.18);
            border-radius: 12px; padding: 10px 16px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ── HELPERS ──
const excelDateToJSDate = (serial) => {
    if (typeof serial !== 'number') return new Date(serial);
    const utc_days = Math.floor(serial - 25569);
    const date_info = new Date(utc_days * 86400 * 1000);
    const frac = serial - Math.floor(serial) + 0.0000001;
    let total_sec = Math.floor(86400 * frac);
    const seconds = total_sec % 60; total_sec -= seconds;
    const hours = Math.floor(total_sec / 3600);
    const minutes = Math.floor(total_sec / 60) % 60;
    return new Date(date_info.getFullYear(), date_info.getMonth(), date_info.getDate(), hours, minutes, seconds);
};
const toLocalDateStr = (d) => { if (!d) return ''; const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; };
const genId = () => { try { const u=crypto.randomUUID(); if(u) return u; } catch(e) {} return Math.random().toString(36).slice(2)+Date.now().toString(36); };
const cleanAuftragsNr = (nr) => { if (!nr) return ''; return String(nr).replace(/\s*\/\s*SLI\s*/gi,'').trim(); };
const DAY_NAMES = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const CAL_TYPES = [
    { key:'montage',    label:'Montage',    icon:'🔧', color:'#3b82f6', bg:'rgba(59,130,246,0.15)',  border:'rgba(59,130,246,0.4)' },
    { key:'beplankung', label:'Beplankung', icon:'🏗',  color:'#10b981', bg:'rgba(16,185,129,0.15)', border:'rgba(16,185,129,0.4)' },
    { key:'ausflocken', label:'Ausflocken', icon:'❄️',  color:'#f97316', bg:'rgba(249,115,22,0.15)', border:'rgba(249,115,22,0.4)' },
];
const parseCalTypes = (calType) => {
    if (!calType||calType==='montage') return ['montage'];
    if (calType==='both'||calType==='all') return ['montage','beplankung','ausflocken'];
    if (calType==='beplankung') return ['beplankung'];
    if (calType==='ausflocken') return ['ausflocken'];
    try { const arr=JSON.parse(calType); if(Array.isArray(arr)) return arr; } catch(e) {}
    return ['montage'];
};

// ── FIREBASE HELPERS ──
const sendToMontage = async (entry, calType) => {
    if (!window._dbMontage) throw new Error('PE-Montage Firebase nicht verbunden');

    // 1) Kalender-Eintrag (Wochenkalender URIM)
    const calId = `cal-${genId()}`;
    await window._dbMontage.collection('artifacts/montage-pe-a5f79/public/data/calentries').doc(calId).set({
        id:calId, createdAt:new Date().toISOString(), isDone:false, isBilled:false,
        entryType:'LIEFERUNG', customer:entry.customer||'', address:entry.address||'',
        memo:entry.memo||'', auftragsNr:cleanAuftragsNr(entry.auftragsNr||''),
        target:entry.target||0, images:[], image:null, deliveryDate:entry.date||'',
        endDate:null, isMultiDay:false, calType:calType||'montage', isProv:false, customStartLabel:'',
    });

    // 2) Objekt-Eintrag (Admin Panel → Dispo-Text Importieren Liste)
    const memo = entry.memo || '';
    const houseInfo = memo.replace(/\d+\s*ELE/gi,'').replace(/\bGIS\b/gi,'').replace(/[-–]\s*$/,'').trim() || 'Gesamtmontage';
    const objId = `obj-${Date.now()}-${Math.random().toString(36).substr(2,5)}`;
    await window._dbMontage.collection('artifacts/montage-pe-a5f79/public/data/objects').doc(objId).set({
        id:objId,
        name: entry.address||'',
        customer: entry.customer||'',
        address: entry.address||'',
        houseInfo: houseInfo,
        auftragsNr: cleanAuftragsNr(entry.auftragsNr||''),
        target: entry.target||0,
        current: 0,
        lastRemaining: null,
        blockReason: null,
        deliveryDate: entry.date ? new Date(entry.date).toISOString() : new Date().toISOString(),
        status: 'active',
        history: [],
    });

    return calId;
};
const sendToKalender = async (entry, teamId, calType) => {
    if (!window._dbKalender) throw new Error('PE-Kalender Firebase nicht verbunden');
    const id = `cal-${genId()}`;
    await window._dbKalender.collection(`teams_cal_${teamId}`).doc(id).set({
        id, createdAt:new Date().toISOString(), isDone:false, isBilled:false,
        entryType:'LIEFERUNG', customer:entry.customer||'', address:entry.address||'',
        memo:entry.memo||'', auftragsNr:cleanAuftragsNr(entry.auftragsNr||''),
        target:entry.target||0, images:[], image:null, deliveryDate:entry.date||'',
        endDate:null, isMultiDay:false, calType:calType||'montage', isProv:false, customStartLabel:'',
    });
    return id;
};

// ── TOAST ──
function Toast({ msg, type, onDone }) {
    useEffect(() => { const t=setTimeout(onDone,3500); return ()=>clearTimeout(t); }, []);
    return (
        <div className={`toast ${type}`}>
            <span style={{fontSize:20}}>{type==='success'?'✅':type==='sending'?'⏳':'❌'}</span>
            <div style={{color:'#fff',fontSize:12,fontWeight:700}}>{msg}</div>
        </div>
    );
}

// ── GROUP DROPDOWN (portal, fixed position) ──
function GroupDropdown({ kalenderTeams, onSelect, onClose, position }) {
    const ref = useRef(null);
    useEffect(() => {
        const h = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
        const s = () => onClose();
        document.addEventListener('mousedown', h);
        window.addEventListener('scroll', s, true);
        return () => { document.removeEventListener('mousedown', h); window.removeEventListener('scroll', s, true); };
    }, []);

    const dropH = 420;
    const spaceBelow = window.innerHeight - (position?.bottom || 0);
    const openUp = spaceBelow < dropH;
    const style = {
        top:  openUp ? 'auto' : (position ? position.bottom + 4 : 0),
        bottom: openUp ? (window.innerHeight - (position?.top || 0) + 4) : 'auto',
        left: position ? Math.min(position.right - 280, window.innerWidth - 290) : 0,
    };

    return ReactDOM.createPortal(
        <div className="group-dropdown" ref={ref} style={style}>
            <div style={{padding:'4px 10px 4px',color:'#475569',fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:1,marginBottom:2}}>
                🔵 PE-MONTAGE — <span style={{color:'#10b981',fontSize:8}}>Kalender + Objekt-Liste</span>
            </div>
            {CAL_TYPES.map(ct => (
                <div key={ct.key} className="group-option" onClick={()=>onSelect('montage',null,ct.key)}
                    style={{borderLeft:`3px solid ${ct.color}`,marginBottom:2}}>
                    <div className="group-option-dot" style={{background:ct.color}}></div>
                    <div style={{flex:1}}><span style={{color:'#fff',fontWeight:900}}>URIM</span><span style={{color:'#475569',marginLeft:5,fontSize:9}}>PE-Montage</span></div>
                    <span className="cal-type-badge" style={{background:ct.bg,color:ct.color,border:`1px solid ${ct.border}`}}>{ct.icon} {ct.label}</span>
                </div>
            ))}
            <div style={{height:1,background:'#1e293b',margin:'6px 2px'}}></div>
            <div style={{padding:'4px 10px 4px',color:'#475569',fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:1,marginBottom:2}}>
                🟣 PE-KALENDER GRUPPEN
            </div>
            {kalenderTeams.length===0 && <div style={{padding:'8px 10px',color:'#475569',fontSize:10}}>Lade Gruppen...</div>}
            {kalenderTeams.map(team => {
                const types = parseCalTypes(team.calType);
                return types.map(ct => {
                    const ctCfg = CAL_TYPES.find(x=>x.key===ct)||CAL_TYPES[0];
                    return (
                        <div key={`${team.id}-${ct}`} className="group-option" onClick={()=>onSelect('kalender',team,ct)}
                            style={{borderLeft:`3px solid ${team.color||ctCfg.color}`,marginBottom:2}}>
                            <div className="group-option-dot" style={{background:team.color||ctCfg.color}}></div>
                            <div style={{flex:1,fontWeight:900,color:'#fff'}}>{team.name}</div>
                            <span className="cal-type-badge" style={{background:ctCfg.bg,color:ctCfg.color,border:`1px solid ${ctCfg.border}`}}>{ctCfg.icon} {ctCfg.label}</span>
                        </div>
                    );
                });
            })}
        </div>,
        document.body
    );
}

// ── SINGLE AUFTRAG ROW ──
function AuftragRow({ entry, kalenderTeams, onSent, toast, selectMode, isSelected, onToggleSelect }) {
    const [open, setOpen] = useState(false);
    const [sending, setSending] = useState(false);
    const [sentTo, setSentTo] = useState([]);
    const [btnRect, setBtnRect] = useState(null);
    const btnRef = useRef(null);

    const handleToggle = (e) => {
        if (selectMode) { onToggleSelect(entry._id); return; }
        if (sending) return;
        if (!open && btnRef.current) setBtnRect(btnRef.current.getBoundingClientRect());
        setOpen(o => !o);
    };

    const handleSelect = async (app, team, calType) => {
        setOpen(false); setSending(true);
        try {
            if (app === 'montage') {
                await sendToMontage(entry, calType);
                const ct = CAL_TYPES.find(x=>x.key===calType);
                setSentTo(prev=>[...prev,{label:`Urim / ${ct?.label||calType}`,color:ct?.color||'#10b981'}]);
                toast('success',`✅ → PE-Montage URIM / ${ct?.label||calType} (Kalender + Objekt-Liste)`);
            } else {
                await sendToKalender(entry, team.id, calType);
                const ct = CAL_TYPES.find(x=>x.key===calType);
                setSentTo(prev=>[...prev,{label:`${team.name} / ${ct?.label||calType}`,color:team.color||ct?.color||'#10b981'}]);
                toast('success',`✅ → ${team.name} / ${ct?.label||calType}`);
            }
            onSent && onSent();
        } catch(err) { toast('error',`❌ ${err.message}`); }
        setSending(false);
    };

    const cardClass = [
        'auftrag-card',
        sentTo.length>0 ? 'sent' : '',
        sending ? 'sending' : '',
        selectMode ? 'selectable' : '',
        isSelected ? 'selected' : '',
    ].filter(Boolean).join(' ');

    return (
        <div className={cardClass}
            style={{padding:'10px 14px 10px 18px', cursor: selectMode ? 'pointer' : 'default'}}
            onClick={selectMode ? ()=>onToggleSelect(entry._id) : undefined}>
            <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
                {/* Checkbox in select mode */}
                {selectMode && (
                    <div className={`cb${isSelected?' checked':''}`} onClick={e=>{e.stopPropagation();onToggleSelect(entry._id);}}>
                        {isSelected && '✓'}
                    </div>
                )}
                {/* Info */}
                <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:3}}>
                        <span style={{color:'#fff',fontSize:13,fontWeight:700,textTransform:'uppercase'}}>{entry.customer}</span>
                        {entry.auftragsNr && (
                            <span style={{background:'rgba(59,130,246,0.1)',border:'1px solid rgba(59,130,246,0.2)',borderRadius:5,padding:'1px 7px',color:'#60a5fa',fontSize:9,fontWeight:800,fontFamily:'monospace'}}>
                                #{cleanAuftragsNr(entry.auftragsNr)}
                            </span>
                        )}
                        {entry.target>0 && (
                            <span style={{background:'rgba(16,185,129,0.1)',border:'1px solid rgba(16,185,129,0.2)',borderRadius:5,padding:'1px 7px',color:'#34d399',fontSize:9,fontWeight:800}}>
                                {entry.target} ELE
                            </span>
                        )}
                    </div>
                    <div style={{color:'#94a3b8',fontSize:11,marginBottom:entry.memo?4:0}}>{entry.address}</div>
                    {entry.memo && (
                        <div style={{display:'flex',gap:5,alignItems:'flex-start',background:'rgba(245,158,11,0.07)',borderLeft:'2px solid #f59e0b',borderRadius:'0 5px 5px 0',padding:'4px 8px',marginTop:4}}>
                            <span style={{fontSize:10}}>📝</span>
                            <span style={{color:'#fbbf24',fontSize:10,fontWeight:600,lineHeight:1.4}}>{entry.memo}</span>
                        </div>
                    )}
                    {sentTo.length>0 && (
                        <div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:6}}>
                            {sentTo.map((s,i)=>(
                                <span key={i} style={{display:'inline-flex',alignItems:'center',gap:4,background:'rgba(16,185,129,0.1)',border:'1px solid rgba(16,185,129,0.3)',borderRadius:6,padding:'2px 8px',fontSize:9,fontWeight:700,color:'#10b981'}}>
                                    ✓ {s.label}
                                </span>
                            ))}
                        </div>
                    )}
                </div>
                {/* Send button — hidden in select mode */}
                {!selectMode && (
                    <div style={{flexShrink:0}}>
                        <button ref={btnRef} onClick={handleToggle} disabled={sending}
                            style={{
                                display:'flex',alignItems:'center',gap:6,padding:'7px 14px',
                                borderRadius:9,cursor:sending?'wait':'pointer',fontSize:10,fontWeight:800,
                                textTransform:'uppercase',letterSpacing:0.8,fontFamily:'Barlow Condensed, sans-serif',
                                border:'1.5px solid',transition:'all 0.15s',
                                background: sentTo.length>0?'rgba(16,185,129,0.1)':sending?'rgba(245,158,11,0.1)':'rgba(59,130,246,0.1)',
                                borderColor: sentTo.length>0?'rgba(16,185,129,0.4)':sending?'rgba(245,158,11,0.4)':'rgba(59,130,246,0.3)',
                                color: sentTo.length>0?'#10b981':sending?'#f59e0b':'#60a5fa',
                            }}>
                            {sending?<><span style={{animation:'pulse 0.8s infinite'}}>⏳</span> Senden...</>
                            :sentTo.length>0?<>✓ Gesendet ({sentTo.length}) ▼</>
                            :<>📤 Senden ▼</>}
                        </button>
                        {open && btnRect && (
                            <GroupDropdown kalenderTeams={kalenderTeams} position={btnRect}
                                onSelect={handleSelect} onClose={()=>setOpen(false)}/>
                        )}
                    </div>
                )}
            </div>
        </div>
    );
}

// ── DAY GROUP ──
function DayGroup({ group, kalenderTeams, toast, selectMode, selectedIds, onToggleSelect, onSelectAll, onDeselectAll }) {
    const allSelected = group.entries.length > 0 && group.entries.every(e => selectedIds.has(e._id));
    const someSelected = group.entries.some(e => selectedIds.has(e._id));
    const selectedCount = group.entries.filter(e => selectedIds.has(e._id)).length;

    return (
        <div style={{marginBottom:24}}>
            <div className="day-header" style={{display:'flex',alignItems:'center',gap:12}}>
                <div style={{flex:1}}>
                    <div className="day-name">{group.name}</div>
                    <div className="day-date">
                        {group.date ? `${String(group.date.getDate()).padStart(2,'0')}.${String(group.date.getMonth()+1).padStart(2,'0')}.${group.date.getFullYear()}` : ''}
                        {' — '}{group.entries.length} Aufträge
                        {selectMode && someSelected && <span style={{color:'#3b82f6',fontWeight:700,marginLeft:8}}>· {selectedCount} markiert</span>}
                    </div>
                </div>
                {selectMode && (
                    <button onClick={allSelected ? ()=>onDeselectAll(group.entries) : ()=>onSelectAll(group.entries)}
                        style={{padding:'4px 12px',borderRadius:8,border:'1.5px solid',fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',fontFamily:'Barlow Condensed',
                            background:allSelected?'rgba(59,130,246,0.2)':'rgba(59,130,246,0.06)',
                            borderColor:allSelected?'#3b82f6':'rgba(59,130,246,0.3)',
                            color:allSelected?'#60a5fa':'#475569'}}>
                        {allSelected ? '✓ Alle abwählen' : 'Alle wählen'}
                    </button>
                )}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {group.entries.map(entry => (
                    <AuftragRow key={entry._id} entry={entry} kalenderTeams={kalenderTeams}
                        toast={toast} selectMode={selectMode}
                        isSelected={selectedIds.has(entry._id)}
                        onToggleSelect={onToggleSelect}/>
                ))}
            </div>
        </div>
    );
}

// ── MULTI-SEND MODAL ──
function MultiSendModal({ entries, kalenderTeams, onClose, onDone, toast }) {
    const [selectedApp, setSelectedApp] = useState('montage');
    const [selectedTeam, setSelectedTeam] = useState(null);
    const [selectedCalType, setSelectedCalType] = useState('montage');
    const [sending, setSending] = useState(false);
    const [progress, setProgress] = useState(0);
    const [sentCount, setSentCount] = useState(0);
    const [done, setDone] = useState(false);

    const canSend = selectedApp === 'montage' || !!selectedTeam;

    const handleSend = async () => {
        setSending(true);
        let sent = 0;
        for (const entry of entries) {
            try {
                if (selectedApp === 'montage') await sendToMontage(entry, selectedCalType);
                else await sendToKalender(entry, selectedTeam.id, selectedCalType);
                sent++;
                setSentCount(sent);
                setProgress(Math.round((sent / entries.length) * 100));
            } catch(err) { console.error(err); }
        }
        setSending(false);
        setDone(true);
        const dest = selectedApp==='montage' ? `PE-Montage URIM` : selectedTeam.name;
        const ct = CAL_TYPES.find(x=>x.key===selectedCalType);
        const extraInfo = selectedApp==='montage' ? ' (Kalender + Objekt-Liste)' : '';
        toast('success', `✅ ${sent}/${entries.length} Aufträge → ${dest} / ${ct?.label||selectedCalType}${extraInfo}`);
        onDone(sent);
    };

                    <div>

                        <div style={{color:'#fff',fontSize:22,fontWeight:900,fontFamily:'Barlow Condensed',textTransform:'uppercase',lineHeight:1.1}}>

                            <div style={{color:'#475569',fontSize:11,marginTop:6}}>
                                → {selectedApp==='montage'?'PE-Montage URIM':selectedTeam?.name} / {CAL_TYPES.find(x=>x.key===selectedCalType)?.label}

// ── MAIN APP ──
function App() {
    const [suffix, setSuffix] = useState('SLI');
    const [rawRows, setRawRows] = useState(null);
    const [groups, setGroups] = useState([]);
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState(null);
    const [kalenderTeams, setKalenderTeams] = useState([]);
    const [toast, setToastMsg] = useState(null);
    const [showSendAll, setShowSendAll] = useState(false);
    const [selectMode, setSelectMode] = useState(false);
    const [selectedIds, setSelectedIds] = useState(new Set());
    const [showMultiSend, setShowMultiSend] = useState(false);
    const fileRef = useRef(null);

    useEffect(() => {
        if (!window._dbKalender) return;
        const unsub = window._dbKalender.collection('teams_config').onSnapshot(snap => {
            setKalenderTeams(snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'')));
        }, err=>console.error(err));
        return ()=>unsub();
    }, []);

    const showToast = (type, msg) => setToastMsg({ type, msg, id: Date.now() });

    const processExcelData = (rows, currentSuffix) => {
        if (rows.length < 5) { setError('Datei enthält zu wenig Daten.'); setLoading(false); return; }
        let colMap = { date:0, memo:2, order:3, customer:4, street:9, zip:10, city:11 };
        for (let i=0; i<Math.min(rows.length,15); i++) {
            const row=rows[i]; if(!row) continue;
            row.forEach((cell,idx)=>{
                const val=String(cell).toLowerCase().trim();
                if(val.includes('datum')) colMap.date=idx;
                if(val==='memo') colMap.memo=idx;
                if(val==='auftrag') colMap.order=idx;
                if(val==='kunde') colMap.customer=idx;
                if(val==='strasse') colMap.street=idx;
                if(val==='plz') colMap.zip=idx;
                if(val==='ort') colMap.city=idx;
            });
        }
        const deliveryGroups = {
            1:{name:'Montag',entries:[],date:null}, 2:{name:'Dienstag',entries:[],date:null},
            3:{name:'Mittwoch',entries:[],date:null}, 4:{name:'Donnerstag',entries:[],date:null},
            5:{name:'Freitag',entries:[],date:null}, 6:{name:'Samstag',entries:[],date:null},
        };
        for (let i=9; i<rows.length; i++) {
            const row=rows[i]; if(!row||row.length<2) continue;
            const rawDate=row[colMap.date]; if(!rawDate) continue;
            const date=typeof rawDate==='number'?excelDateToJSDate(rawDate):new Date(rawDate);
            if(isNaN(date.getTime())) continue;
            const dow=date.getDay(); if(!deliveryGroups[dow]) continue;
            if(!deliveryGroups[dow].date) deliveryGroups[dow].date=date;
            const kunde=String(row[colMap.customer]||'').trim();
            const strasse=String(row[colMap.street]||'').trim();
            const plz=String(row[colMap.zip]||'').trim();
            const ort=String(row[colMap.city]||'').trim();
            const memo=String(row[colMap.memo]||'').trim().replace(/\r?\n|\r/g,' ');
            const auftrag=String(row[colMap.order]||'').trim();
            const adresse=(strasse||plz||ort)?`${strasse}, ${plz} ${ort}`.trim().replace(/^,|,\s*$/,''):'';
            const eleMatch=memo.match(/(\d+)\s*ELE/i);
            deliveryGroups[dow].entries.push({
                _id:genId(), customer:kunde, address:adresse, memo,
                auftragsNr:`${auftrag}/${currentSuffix}`, target:eleMatch?parseInt(eleMatch[1]):0,
                date:toLocalDateStr(date),
            });
        }
        setGroups([1,2,3,4,5,6].map(d=>deliveryGroups[d]).filter(g=>g.entries.length>0));
        setLoading(false);
    };

    useEffect(()=>{ if(rawRows) processExcelData(rawRows,suffix); }, [suffix]);

    const handleFile = (e) => {
        const file=e.target.files[0]; if(!file) return;
        setLoading(true); setError(null);
        const reader=new FileReader();
        reader.onload=(evt)=>{
            try {
                const wb=XLSX.read(evt.target.result,{type:'binary'});
                const ws=wb.Sheets[wb.SheetNames[0]];
                const jsonData=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
                setRawRows(jsonData); processExcelData(jsonData,suffix);
            } catch(err) { setError('Fehler beim Verarbeiten der Datei.'); setLoading(false); }
        };
        reader.readAsBinaryString(file);
    };

    const toggleSelectMode = () => {
        setSelectMode(s => !s);
        setSelectedIds(new Set());
    };
    const toggleSelect = (id) => setSelectedIds(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
    const selectAll = (entries) => setSelectedIds(prev=>{const n=new Set(prev);entries.forEach(e=>n.add(e._id));return n;});
    const deselectAll = (entries) => setSelectedIds(prev=>{const n=new Set(prev);entries.forEach(e=>n.delete(e._id));return n;});
    const selectAllEverything = () => setSelectedIds(new Set(groups.flatMap(g=>g.entries.map(e=>e._id))));
    const clearSelection = () => setSelectedIds(new Set());

    const selectedEntries = useMemo(()=>groups.flatMap(g=>g.entries).filter(e=>selectedIds.has(e._id)), [groups, selectedIds]);
    const totalEntries = groups.reduce((s,g)=>s+g.entries.length, 0);

    return (
        <div style={{minHeight:'100vh',background:'#0a0f1a'}}>
            {/* HEADER */}
            <div style={{background:'linear-gradient(180deg,#0f172a,#0a0f1a)',borderBottom:'1px solid #1e293b',padding:'16px 32px',position:'sticky',top:0,zIndex:50}}>
                <div style={{maxWidth:1200,margin:'0 auto',display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
                    <div>
                        <h1 style={{margin:0,fontSize:26,fontFamily:'Barlow Condensed',fontWeight:900,textTransform:'uppercase',letterSpacing:2,color:'#fff',lineHeight:1}}>TOURENDISPO</h1>
                        <div style={{color:'#3b82f6',fontSize:9,fontWeight:700,letterSpacing:3,textTransform:'uppercase',marginTop:2}}>PROZESSOR v2 — MULTI-KALENDER</div>
                    </div>
                    <div style={{display:'flex',gap:6,marginLeft:'auto'}}>
                        <div style={{display:'flex',alignItems:'center',gap:5,background:'rgba(16,185,129,0.08)',border:'1px solid rgba(16,185,129,0.2)',borderRadius:20,padding:'3px 10px'}}>
                            <div style={{width:5,height:5,borderRadius:'50%',background:window._dbMontage?'#10b981':'#ef4444'}}></div>
                            <span style={{color:'#10b981',fontSize:9,fontWeight:700}}>PE-MONTAGE</span>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:5,background:'rgba(99,102,241,0.08)',border:'1px solid rgba(99,102,241,0.2)',borderRadius:20,padding:'3px 10px'}}>
                            <div style={{width:5,height:5,borderRadius:'50%',background:window._dbKalender?'#6366f1':'#ef4444'}}></div>
                            <span style={{color:'#a5b4fc',fontSize:9,fontWeight:700}}>PE-KALENDER ({kalenderTeams.length})</span>
                        </div>
                    </div>
                </div>
            </div>

            <div style={{maxWidth:1200,margin:'0 auto',padding:'24px 32px'}}>
                {/* CONTROLS */}
                <div style={{display:'grid',gridTemplateColumns:'180px 1fr auto auto',gap:12,marginBottom:20,alignItems:'end'}}>
                    <div>
                        <div style={{color:'#64748b',fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>Kennzeichen</div>
                        <input type="text" value={suffix} onChange={e=>setSuffix(e.target.value.toUpperCase())} placeholder="SLI"
                            style={{width:'100%',padding:'10px 14px',background:'#111827',border:'1.5px solid #1f2937',borderRadius:10,color:'#fff',fontSize:14,fontWeight:700,textTransform:'uppercase',letterSpacing:2,outline:'none'}}/>
                    </div>
                    <div>
                        <div style={{color:'#64748b',fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>Excel Datei</div>
                        <button onClick={()=>fileRef.current.click()}
                            style={{width:'100%',padding:'10px 20px',background:'linear-gradient(135deg,#1d4ed8,#4f46e5)',border:'none',borderRadius:10,color:'#fff',fontSize:12,fontWeight:800,textTransform:'uppercase',letterSpacing:1,cursor:'pointer',fontFamily:'Barlow Condensed',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
                            📂 EXCEL DATEI WÄHLEN
                        </button>
                        <input ref={fileRef} type="file" accept=".xlsx" onChange={handleFile} style={{display:'none'}}/>
                    </div>
                    {groups.length>0 && (
                        <>
                            <button onClick={toggleSelectMode}
                                style={{padding:'10px 18px',borderRadius:10,border:'1.5px solid',fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:0.8,cursor:'pointer',fontFamily:'Barlow Condensed',whiteSpace:'nowrap',transition:'all 0.15s',
                                    background:selectMode?'rgba(59,130,246,0.2)':'rgba(255,255,255,0.04)',
                                    borderColor:selectMode?'#3b82f6':'#334155',
                                    color:selectMode?'#60a5fa':'#94a3b8'}}>
                                {selectMode ? '✕ Abbrechen' : '☑ Auswählen'}
                            </button>
                            <button onClick={()=>setShowSendAll(true)}
                                style={{padding:'10px 18px',background:'linear-gradient(135deg,#059669,#10b981)',border:'none',borderRadius:10,color:'#fff',fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:0.8,cursor:'pointer',fontFamily:'Barlow Condensed',whiteSpace:'nowrap'}}>
                                📤 ALLE {totalEntries}
                            </button>
                        </>
                    )}
                </div>

                {loading && <div style={{textAlign:'center',padding:'60px 0',color:'#3b82f6',fontSize:14,fontWeight:700}}>⏳ Verarbeite Datei...</div>}
                {error && <div style={{background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.3)',borderRadius:10,padding:'12px 16px',color:'#f87171',marginBottom:16}}>❌ {error}</div>}

                {/* STATS */}
                {groups.length>0 && (
                    <div style={{display:'flex',gap:12,marginBottom:20,flexWrap:'wrap'}}>
                        <div className="stat-box"><div className="stat-val" style={{color:'#60a5fa'}}>{totalEntries}</div><div className="stat-label">Aufträge</div></div>
                        <div className="stat-box"><div className="stat-val" style={{color:'#a5b4fc'}}>{groups.length}</div><div className="stat-label">Tage</div></div>
                        <div className="stat-box"><div className="stat-val" style={{color:'#34d399'}}>{kalenderTeams.length}</div><div className="stat-label">Gruppen</div></div>
                        {selectMode && (
                            <div className="stat-box" style={{background:'rgba(59,130,246,0.08)',borderColor:'rgba(59,130,246,0.2)'}}>
                                <div className="stat-val" style={{color:'#3b82f6'}}>{selectedIds.size}</div>
                                <div className="stat-label">Markiert</div>
                            </div>
                        )}
                        <div className="stat-box" style={{flex:1,minWidth:180}}>
                            <div style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:1,color:'#64748b',marginBottom:5}}>Gruppen</div>
                            <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                                <span style={{background:'rgba(59,130,246,0.1)',border:'1px solid rgba(59,130,246,0.25)',borderRadius:6,padding:'2px 7px',fontSize:8,fontWeight:700,color:'#60a5fa'}}>🔵 URIM</span>
                                {kalenderTeams.map(t=>(
                                    <span key={t.id} style={{background:'rgba(99,102,241,0.1)',border:'1px solid rgba(99,102,241,0.25)',borderRadius:6,padding:'2px 7px',fontSize:8,fontWeight:700,color:'#a5b4fc'}}>{t.name}</span>
                                ))}
                            </div>
                        </div>
                    </div>
                )}

                {/* SELECT MODE TOOLBAR */}
                {selectMode && groups.length>0 && (
                    <div className="sel-toolbar">
                        <span style={{color:'#60a5fa',fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:1}}>☑ Auswahlmodus</span>
                        <span style={{color:'#94a3b8',fontSize:10}}>{selectedIds.size} von {totalEntries} markiert</span>
                        <button onClick={selectAllEverything} style={{padding:'4px 12px',borderRadius:8,border:'1px solid rgba(59,130,246,0.3)',background:'rgba(59,130,246,0.1)',color:'#60a5fa',fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',fontFamily:'Barlow Condensed'}}>
                            Alle wählen ({totalEntries})
                        </button>
                        <button onClick={clearSelection} style={{padding:'4px 12px',borderRadius:8,border:'1px solid #1e293b',background:'transparent',color:'#64748b',fontSize:9,fontWeight:800,textTransform:'uppercase',cursor:'pointer',fontFamily:'Barlow Condensed'}}>
                            Alle abwählen
                        </button>
                        <div style={{flex:1}}></div>
                        <span style={{color:'#64748b',fontSize:9}}>Aufträge anklicken zum Markieren</span>
                    </div>
                )}

                {/* AUFTRÄGE */}
                {groups.map((group, i) => (
                    <DayGroup key={i} group={group} kalenderTeams={kalenderTeams} toast={showToast}
                        selectMode={selectMode} selectedIds={selectedIds}
                        onToggleSelect={toggleSelect}
                        onSelectAll={selectAll} onDeselectAll={deselectAll}/>
                ))}

                {groups.length===0 && !loading && !error && (
                    <div style={{textAlign:'center',padding:'80px 0'}}>
                        <div style={{fontSize:64,marginBottom:16}}>📂</div>
                        <div style={{fontSize:18,fontFamily:'Barlow Condensed',fontWeight:900,textTransform:'uppercase',letterSpacing:2,color:'#334155'}}>Excel Datei hochladen</div>
                        <div style={{color:'#1e293b',fontSize:12,marginTop:8}}>Aufträge werden verarbeitet — pro Auftrag oder als Auswahl senden</div>
                    </div>
                )}
            </div>

            {/* FLOATING SELECTION BAR */}
            {selectMode && selectedIds.size>0 && (
                <div className="sel-bar">
                    <div style={{background:'linear-gradient(135deg,#3b82f6,#6366f1)',color:'#fff',fontFamily:'Barlow Condensed',fontSize:22,fontWeight:900,borderRadius:10,padding:'2px 16px',minWidth:44,textAlign:'center'}}>
                        {selectedIds.size}
                    </div>
                    <div>
                        <div style={{color:'#fff',fontSize:12,fontWeight:700,fontFamily:'Barlow Condensed',textTransform:'uppercase',letterSpacing:1}}>
                            {selectedIds.size} Aufträge markiert
                        </div>
                        <div style={{color:'#475569',fontSize:9,marginTop:1}}>Bereit zum Senden</div>
                    </div>
                    <div style={{width:1,height:32,background:'#1e293b'}}></div>
                    <button onClick={()=>setShowMultiSend(true)}
                        style={{padding:'10px 20px',background:'linear-gradient(135deg,#10b981,#059669)',border:'none',borderRadius:12,color:'#fff',fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:0.8,cursor:'pointer',fontFamily:'Barlow Condensed',boxShadow:'0 4px 14px rgba(16,185,129,0.4)',display:'flex',alignItems:'center',gap:6}}>
                        📤 Auswahl senden
                    </button>
                    <button onClick={clearSelection}
                        style={{padding:'10px 14px',background:'rgba(255,255,255,0.06)',border:'1px solid #334155',borderRadius:12,color:'#94a3b8',fontSize:10,fontWeight:700,cursor:'pointer',fontFamily:'Barlow Condensed',textTransform:'uppercase'}}>
                        Leeren
                    </button>
                    <button onClick={toggleSelectMode}
                        style={{padding:'10px 14px',background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.25)',borderRadius:12,color:'#ef4444',fontSize:10,fontWeight:700,cursor:'pointer',fontFamily:'Barlow Condensed',textTransform:'uppercase'}}>
                        ✕
                    </button>
                </div>
            )}

            {/* MODALS */}
            {showSendAll && (
                <SendAllModal groups={groups} kalenderTeams={kalenderTeams}
                    onClose={()=>setShowSendAll(false)} toast={showToast}/>
            )}
            {showMultiSend && (
                <MultiSendModal entries={selectedEntries} kalenderTeams={kalenderTeams}
                    onClose={()=>setShowMultiSend(false)} toast={showToast}
                    onDone={(count)=>{ setShowMultiSend(false); clearSelection(); setSelectMode(false); }}/>
            )}

            {/* TOAST */}
            {toast && <Toast key={toast.id} msg={toast.msg} type={toast.type} onDone={()=>setToastMsg(null)}/>}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
